name: Feature idea
description: Suggest something QRCache could do
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like QRCache to do?
      description: Tell us the situation you're in and what would help.
    validations:
      required: true
  - type: markdown
    attributes:
      value: QRCache is finished and no new features are planned, but ideas are still welcome for anyone who forks it. The [roadmap](https://github.com/Eros-Byrne/QRCache/blob/main/docs/ROADMAP.md#ideas-not-built) lists ideas that were considered.
