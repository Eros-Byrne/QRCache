name: Release

# Builds the signed Play Store bundle (.aab) and APK.
# Runs when a version tag like v1.0.0 is pushed, or by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.QRCACHE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The QRCACHE_KEYSTORE_BASE64 secret is not set. See docs/RELEASING.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "QRCACHE_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed bundle and APK
        env:
          QRCACHE_KEYSTORE_PASSWORD: ${{ secrets.QRCACHE_KEYSTORE_PASSWORD }}
          QRCACHE_KEY_ALIAS: ${{ secrets.QRCACHE_KEY_ALIAS }}
          QRCACHE_KEY_PASSWORD: ${{ secrets.QRCACHE_KEY_PASSWORD }}
        run: ./gradlew testReleaseUnitTest bundleRelease assembleRelease

      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload bundle and APK
        uses: actions/upload-artifact@v4
        with:
          name: qrcache-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt

      - name: Attach APK to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
