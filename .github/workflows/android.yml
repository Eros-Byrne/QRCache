name: Android CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, lint and unit test
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest

      # Shrunk (R8) release build signed with the runner's debug key, so the
      # exact code that ships can be installed and tested on a phone.
      - name: Build release APK for testing
        run: ./gradlew assembleRelease -Pqrcache.testSigning

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: qrcache-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release test APK
        uses: actions/upload-artifact@v4
        with:
          name: qrcache-release-test-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
